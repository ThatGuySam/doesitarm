name: Deploy Cloudflare Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-frontend-production
  cancel-in-progress: true

env:
  COMMITS_SOURCE: https://doesitarm-functions-scc.vercel.app/api/commits
  GAMES_SOURCE: https://script.google.com/macros/s/AKfycbzGvKKUIaqsMuCj7-A2YRhR-f7GZjl4kSxSN1YyLkS01_CfiyE/exec?id=1er-NivvuIheDmIKBVRu3S_BzA_lZT5z3Z-CxQZ-uPVs&sheet=Games&header=2&startRow=3
  HOMEBREW_SOURCE: https://doesitarm-functions-scc.vercel.app/api/homebrew-issue
  PUBLIC_API_DOMAIN: https://api.doesitarm.com
  PUBLIC_URL: https://doesitarm.com
  SCANS_SOURCE: https://doesitarm-functions-scc.vercel.app/app-test-reports.json
  TEST_RESULT_STORE: https://doesitarm-functions-scc.vercel.app/api/test-results-store
  URL: https://doesitarm.com
  VFUNCTIONS_URL: https://doesitarm-functions-scc.vercel.app
  VIDEO_SOURCE: https://youtube.doesitarm.com/snapshot/youtube-videos.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: pnpm install --frozen-lockfile

      - name: Install scanner toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.1
          cargo install --locked -j2 wasm-bindgen-cli --version 0.2.130

      # /ui is a side project that must never block the site deploy. Restore
      # the last good build, rebuild only when ui-review/ changed, and keep the
      # old assets if the rebuild fails.
      - name: Restore /ui assets
        id: ui-cache
        uses: actions/cache/restore@v4
        with:
          path: static/ui-assets
          key: ui-assets-${{ hashFiles('ui-review/**', 'scripts/build-ui-isolated.mjs', '!ui-review/node_modules/**') }}
          restore-keys: ui-assets-

      - name: Build /ui assets (isolated, allowed to fail)
        id: ui-build
        if: steps.ui-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm build:ui:isolated

      - name: Save /ui assets
        if: steps.ui-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: static/ui-assets
          key: ui-assets-${{ hashFiles('ui-review/**', 'scripts/build-ui-isolated.mjs', '!ui-review/node_modules/**') }}

      - name: Build and test Cloudflare frontend
        run: pnpm cloudflare-build

      - name: Verify scanner assets in the deployment
        run: |
          test -s dist/client/scanner-next/scan-worker.js
          test -s dist/client/scanner-next/pkg/scan_wasm.js
          test -s dist/client/scanner-next/pkg/scan_wasm_bg.wasm

      - name: Deploy exact commit
        run: >-
          pnpm exec wrangler deploy
          --config dist/server/wrangler.json
          --message "GitHub ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Verify live preview routes
        run: bun scripts/health https://cf.doesitarm.com

      - name: Verify live preview freshness and indexing
        run: pnpm verify:cloudflare:live -- --host=https://cf.doesitarm.com
