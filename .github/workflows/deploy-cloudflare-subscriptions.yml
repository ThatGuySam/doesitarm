name: Deploy Cloudflare Subscriptions

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - workers/subscriptions/**
      - helpers/rosetta-catalog.js
      - helpers/rosetta-launch.js
      - helpers/subscription-interests.js
      - test/subscriptions-worker.test.js
      - scripts/verify-subscriptions-worker.mjs
      - .github/workflows/deploy-cloudflare-subscriptions.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: cloudflare-subscriptions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test subscription Worker
        run: pnpm test:subscriptions

      - name: Apply D1 migrations
        run: >-
          pnpm exec wrangler d1 migrations apply
          doesitarm-subscriptions
          --remote
          --config workers/subscriptions/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}

      - name: Deploy exact commit
        run: >-
          pnpm exec wrangler deploy
          --config workers/subscriptions/wrangler.jsonc
          --message "GitHub ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}

      - name: Verify D1 binding and CORS
        run: node scripts/verify-subscriptions-worker.mjs

      - name: Check Rosetta app status
        continue-on-error: true
        run: |
          if [ -z "$ROSETTA_CHECK_TOKEN" ]; then
            echo "::notice::Set ROSETTA_CHECK_TOKEN to enable the post-deploy Rosetta check."
            exit 0
          fi
          result="$RUNNER_TEMP/rosetta-check.json"
          if ! status=$(curl --silent --show-error --max-time 480 \
            --output "$result" --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $ROSETTA_CHECK_TOKEN" \
            https://doesitarm.com/api/subscriptions/check-rosetta); then
            echo "::notice::Rosetta check could not reach the subscriptions Worker."
            exit 0
          fi
          if summary=$(jq -ce '{ok, mode, changes, notifications, observation, deliveries, confirmations, error}' "$result" 2>/dev/null); then
            summary=${summary//%/%25}
            echo "::notice::Rosetta check returned HTTP $status. $summary"
            if [ "$status" = 409 ]; then
              echo "::notice::$(jq -r '.recovery.message // "Review the published catalog."' "$result")"
              while IFS= read -r command; do
                printf '::notice::%s\n' "$command"
              done < <(jq -r '.recovery | (.reviewCommand, .acceptSilentlyCommand, .retryCommand) | select(. != null)' "$result")
            fi
          else
            echo "::notice::Rosetta check returned HTTP $status without a JSON result."
          fi
        env:
          ROSETTA_CHECK_TOKEN: ${{ secrets.ROSETTA_CHECK_TOKEN }}
