name: Deploy Legacy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - doesitarm-default/**
      - workers/analytics/**
      - .github/workflows/deploy-cloudflare-workers.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v6

      - name: Deploy default Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 8d4ef8fe891f53e5658d3fdd5a4c7630
          command: deploy --config wrangler.jsonc --message "GitHub ${{ github.sha }}"
          workingDirectory: doesitarm-default
          wranglerVersion: 4.105.0

      - name: Deploy analytics Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 8d4ef8fe891f53e5658d3fdd5a4c7630
          command: deploy --config wrangler.jsonc --message "GitHub ${{ github.sha }}"
          workingDirectory: workers/analytics
          wranglerVersion: 4.105.0
