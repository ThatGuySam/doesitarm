[package]
name = "scan-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
plist = { version = "1", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
bzip2 = "0.6"
lzfse_rust = "0.2"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
unicode-normalization = "0.1"
roxmltree = "0.21"
ruzstd = "0.9.1"
sevenz-rust2 = { version = "0.25", default-features = false }
